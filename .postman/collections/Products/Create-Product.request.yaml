$kind: http-request
name: Create Product
order: 1000
url: '{{baseUrl}}/products'
method: POST
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "categoryId": {{categoryId}},
      "name": "Hamburguesa Clásica",
      "description": "Carne, lechuga, tomate, queso",
      "price": 25000,
      "status": "available"
    }