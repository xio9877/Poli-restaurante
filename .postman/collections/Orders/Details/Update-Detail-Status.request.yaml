$kind: http-request
name: Update Detail Status
order: 4000
url: '{{baseUrl}}/orders/{{orderId}}/details/{{detailId}}/status'
method: PATCH
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "ready",
      "notes": "Listo para servir"
    }
