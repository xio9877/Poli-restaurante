$kind: http-request
name: Update Order Status
order: 5000
url: '{{baseUrl}}/orders/{{orderId}}/status'
method: PATCH
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "in_preparation",
      "notes": "Comenzando preparación"
    }
