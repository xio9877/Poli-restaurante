$kind: http-request
name: Create Order
order: 1000
url: '{{baseUrl}}/orders'
method: POST
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "details": [
        { "productId": 1, "amount": 2, "notes": "Sin sal" },
        { "productId": 3, "amount": 1 }
      ],
      "notes": "Mesa para 4 personas"
    }
