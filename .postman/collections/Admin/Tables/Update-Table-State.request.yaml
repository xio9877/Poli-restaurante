$kind: http-request
name: Update Table State
order: 5000
url: '{{baseUrl}}/admin/tables/{{tableId}}/state'
method: PATCH
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "state": "unavailable"
    }
