$kind: http-request
name: Update Product Status
order: 5000
url: '{{baseUrl}}/admin/products/{{productId}}/status'
method: PATCH
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "unavailable"
    }
