$kind: http-request
name: Create Category
order: 1000
url: '{{baseUrl}}/categories'
method: POST
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Bebidas",
      "description": "Bebidas frías y calientes"
    }