<div class="space-y-6" x-data="dashboard()">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <h2 class="text-2xl font-bold text-dark-900">Dashboard</h2>
    <div class="flex gap-2">
      <button @click="createWalkInOrder()" class="btn-primary">+ Orden Rápida</button>
      <button @click="$store.router.navigate('/tables')" class="btn-secondary">
        Gestionar Mesas
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    <div class="card card-hover p-5">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-sm text-dark-500">Órdenes Activas</p>
          <p class="text-3xl font-bold text-dark-900" x-text="stats.activeOrders"></p>
        </div>
        <div
          class="w-12 h-12 rounded-xl bg-primary-100 flex items-center justify-center text-primary-600"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"
            ></path>
          </svg>
        </div>
      </div>
    </div>
    <div class="card card-hover p-5">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-sm text-dark-500">Mesas Ocupadas</p>
          <p class="text-3xl font-bold text-dark-900" x-text="stats.occupiedTables"></p>
        </div>
        <div
          class="w-12 h-12 rounded-xl bg-amber-100 flex items-center justify-center text-amber-600"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 8V4m0 0h12m-12 0a2 2 0 012-2h10a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V8z"
            ></path>
          </svg>
        </div>
      </div>
    </div>
    <div class="card card-hover p-5">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-sm text-dark-500">Ventas Hoy</p>
          <p
            class="text-3xl font-bold text-dark-900"
            x-text="$store.formatters.currency(stats.todaySales)"
          ></p>
        </div>
        <div
          class="w-12 h-12 rounded-xl bg-green-100 flex items-center justify-center text-green-600"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            ></path>
          </svg>
        </div>
      </div>
    </div>
    <div class="card card-hover p-5">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-sm text-dark-500">Productos No Disponibles</p>
          <p class="text-3xl font-bold text-dark-900" x-text="stats.lowStock"></p>
        </div>
        <div class="w-12 h-12 rounded-xl bg-red-100 flex items-center justify-center text-red-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
            ></path>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="card">
      <div class="card-header">
        <h3 class="font-semibold text-dark-900">Órdenes Recientes</h3>
      </div>
      <div class="divide-y divide-dark-100 max-h-96 overflow-y-auto scrollbar-thin">
        <template x-for="order in recentOrders" :key="order.id">
          <div class="p-4 flex items-center justify-between hover:bg-dark-50">
            <div class="flex items-center gap-3">
              <span
                class="badge"
                :class="$store.formatters.orderStatusClass(order.status)"
                x-text="$store.formatters.orderStatus(order.status)"
              ></span>
              <div>
                <p class="font-medium text-dark-900">Orden #<span x-text="order.id"></span></p>
                <p
                  class="text-sm text-dark-500"
                  x-text="order.table ? 'Mesa ' + order.table.name : 'Delivery'"
                ></p>
              </div>
            </div>
            <div class="text-right">
              <p
                class="font-semibold text-dark-900"
                x-text="$store.formatters.currency(order.total)"
              ></p>
              <p class="text-xs text-dark-500" x-text="$store.formatters.time(order.createdAt)"></p>
            </div>
          </div>
        </template>
        <div x-show="recentOrders.length === 0" class="p-8 text-center text-dark-500">
          No hay órdenes recientes
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3 class="font-semibold text-dark-900">Mesas - Estado Rápido</h3>
      </div>
      <div class="card-body">
        <div class="p-4 text-center text-dark-500">
          <svg
            class="w-12 h-12 mx-auto text-dark-300 mb-2"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 8V4m0 0h12m-12 0a2 2 0 012-2h10a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V8z"
            ></path>
          </svg>
          <p>
            Visita la sección
            <a
              href="#"
              @click.prevent="$store.router.navigate('/tables')"
              class="text-primary-600 hover:underline"
              >Mesas</a
            >
            para ver el estado completo
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
